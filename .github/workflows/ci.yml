name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.30"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -m "not integration"
